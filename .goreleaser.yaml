# GoReleaser config for dtui.
# Docs: https://goreleaser.com
version: 2

project_name: dtui

before:
  hooks:
    # Only download — never `go mod tidy`, which could dirty the tree and make
    # GoReleaser refuse to run.
    - go mod download
    # Shell completions are generated from the host build and shipped in the
    # archives; the Homebrew cask installs them.
    - go build -o "/tmp/dtui-completions-helper" .
    - sh -c 'mkdir -p completions'
    - sh -c '"/tmp/dtui-completions-helper" completion bash > completions/dtui.bash'
    - sh -c '"/tmp/dtui-completions-helper" completion zsh > completions/dtui.zsh'
    - sh -c '"/tmp/dtui-completions-helper" completion fish > completions/dtui.fish'

builds:
  - id: dtui
    binary: dtui
    main: .
    # The TUI is pure Go; a CGO-free build cross-compiles cleanly.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Match `make build`: stamp both dtui's version and the dtctl
    # pkg/version vars that consumed dtctl packages read.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/dynatrace-oss/dtctl/pkg/version.Version={{ .Version }}
      - -X github.com/dynatrace-oss/dtctl/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/dynatrace-oss/dtctl/pkg/version.Date={{ .Date }}

archives:
  - id: dtui
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing files replaces GoReleaser's defaults, so LICENSE and README are
    # repeated here. NOTICE and the third_party/ files satisfy the attribution
    # terms of the bundled dependencies; regenerate them with
    # scripts/third-party-licenses.sh.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - third_party/THIRD_PARTY_LICENSES.txt
      - third_party/licenses.csv
      - src: completions/*
        dst: completions

checksum:
  name_template: checksums.txt

signs:
  # cosign v3 signs into a single Sigstore bundle. Verify with:
  # cosign verify-blob --bundle checksums.txt.sigstore.json ... checksums.txt
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive
    cmd: syft
    args:
      - "${artifact}"
      - "--output"
      - "spdx-json=${document}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

homebrew_casks:
  - repository:
      owner: dynatrace-oss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/dynatrace-oss/dtui
    description: "Interactive, keyboard-driven terminal UI for Dynatrace"
    # auto skips the tap push for prerelease tags.
    skip_upload: auto
    completions:
      bash: completions/dtui.bash
      zsh: completions/dtui.zsh
      fish: completions/dtui.fish
    # The binaries are not notarized, so clear the quarantine flag that Homebrew
    # sets on macOS downloads. A raw postflight block, because the structured
    # `hooks.post.install` is deprecated and `install_steps` cannot express an
    # OS check.
    custom_block: |
      postflight do
        if OS.mac?
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dtui"]
        end
      end

# Release notes are written by release-please (GitHub Release body) and
# GoReleaser only attaches artifacts to that existing release, so it must not
# generate a changelog or overwrite the notes.
changelog:
  disable: true

release:
  mode: keep-existing
