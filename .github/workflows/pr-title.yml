name: pr-title

# Squash merges land the PR title on main, and release-please derives the next
# version from it. A title that is not a conventional commit is silently ignored
# by release-please, so it is rejected here instead.
#
# pull_request: release-please opens its PR with GITHUB_TOKEN; those events start
# pull_request workflows (same as ci) but not pull_request_target, so without this
# the required "Conventional PR title" check never reports and blocks the merge.
# pull_request_target: kept so fork PRs still validate, and so a title edit on an
# already-open release PR can still re-run the check from the base-branch workflow.
# This workflow never checks out or runs PR code.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: conventional-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate the PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
