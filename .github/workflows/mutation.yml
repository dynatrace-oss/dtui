name: mutation

# Mutation testing (gremlins): flips operators and conditions in the code and
# checks that some test fails. Line coverage says a line ran; this says a
# test would notice if its logic were wrong. This workflow checks a PR's
# changed lines; mutation-full.yml runs the whole module weekly. See
# CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.gremlins.yaml'
      - 'makefile'
      - 'scripts/mutation-*.sh'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-lines:
    name: changed lines (80% gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --diff needs the merge base
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Mutation test the diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make mutation-diff MUTATION_BASE="origin/$BASE_REF"
