name: mutation

# Mutation testing (gremlins): flips operators and conditions in the code and
# checks that some test fails. Line coverage says a line ran; this says a
# test would notice if its logic were wrong. See CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.gremlins.yaml'
      - 'makefile'
      - 'scripts/mutation-*.sh'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '41 3 * * 0' # weekly full report
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-lines:
    name: Mutation (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --diff needs the merge base
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Mutation test the diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make mutation-diff MUTATION_BASE="origin/$BASE_REF"

  # The full run is ~4,000 mutants, each recompiling and testing its package:
  # serial on one runner it takes over two hours, so it splits into shards of
  # equal mutant count (scripts/mutation-shard.sh) and merges the reports.
  full:
    name: Mutation (shard ${{ matrix.shard }}/8)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Some mutants turn a loop into an endless append (e.g. negating
      # `for len(body) < height-2` in home.go) and eat the runner's memory in
      # seconds, so the runner dies. Capping each process's data segment makes
      # such a test binary crash on its own, which counts as a killed mutant.
      # On a timeout gremlins kills `go test` but not the test binary it
      # spawned, so the short test timeout also stops orphaned loops.
      - name: Mutation test the shard
        env:
          GOFLAGS: -timeout=2m
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -d 3145728
          make mutation-shard MUTATION_SHARD="$SHARD" MUTATION_SHARDS=8

      - name: Upload shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutation-${{ matrix.shard }}.json

  report:
    name: Mutation (full report)
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          merge-multiple: true

      - name: Merge and check the threshold
        run: make mutation-merge

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation.json
          if-no-files-found: ignore
